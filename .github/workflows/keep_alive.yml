name: Keep Streamlit App Alive

on:
  schedule:
    - cron: "*/45 * * * *" # every 45 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -L --max-time 30 https://weather-classification-model-2024dc04013.streamlit.app/ > /dev/null || true
